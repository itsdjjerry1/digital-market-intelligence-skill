name: Bug report
description: Report a problem or misleading behavior in the skill.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the prompt/workflow and relevant non-sensitive details. Do not include credentials or private data.
    validations:
      required: false
